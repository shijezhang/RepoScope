[project]
name = "reposcope"
version = "0.2.0"
description = "Snapshot-bound Python change impact analysis and regression verification"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "networkx>=3.3,<4", "httpx>=0.27,<1", "typer>=0.12,<1", "rank-bm25>=0.2.2,<1"]

[project.optional-dependencies]
models = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
reposcope = "reposcope.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reposcope*"]

[tool.pytest.ini_options]
testpaths = ["tests/reposcope"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
